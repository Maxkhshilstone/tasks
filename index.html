<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#f3f6fb">
<script>
  // Apply saved theme (or the phone's setting) before first paint to avoid a flash.
  (function () {
    var t = null;
    try { t = JSON.parse(localStorage.getItem('todo.v1.theme')); } catch (e) {}
    if (t !== 'dark' && t !== 'light') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tasks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Tasks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header class="top">
    <div class="bar">
      <div id="kicker" class="kicker"></div>
      <div class="actions">
        <button id="todayBtn" class="pill" hidden>Back to today</button>
        <button id="syncBtn" class="pill sync" aria-label="Sync status"><span class="dot"></span><span id="syncText"></span></button>
        <button id="themeBtn" class="icon" aria-label="Switch light or dark mode">☾</button>
        <button id="gearBtn" class="icon" aria-label="Settings">⚙︎</button>
      </div>
    </div>
    <h1 id="title"></h1>
  </header>

  <nav class="week" aria-label="Week">
    <button id="prevWk" class="wkNav" aria-label="Previous week">‹</button>
    <div id="days" class="days"></div>
    <button id="nextWk" class="wkNav" aria-label="Next week">›</button>
  </nav>

  <main id="list" class="list"></main>
</div>

<button id="fab" class="fab" aria-label="Add task">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  <span>Add</span>
</button>

<!-- Add / edit sheet -->
<div id="sheet" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <div class="grab"></div>
    <h2 id="sTitle">New task</h2>
    <textarea id="sText" rows="2" placeholder="reminder, follow up with cleaners next Monday" autocapitalize="sentences" enterkeyhint="done"></textarea>
    <p id="sHint" class="hint">Tap the 🎤 on your keyboard and say: “reminder, … tomorrow” or “… at 1:30”.</p>
    <div id="sPreview" class="preview"></div>
    <div class="fields">
      <label>Date<input type="date" id="sDate"></label>
      <label>Time <button type="button" id="sClearTime" class="link">no time</button><input type="time" id="sTime"></label>
    </div>
    <div class="sheetBtns">
      <button id="sDelete" class="danger" hidden>Delete</button>
      <button id="sFollow" class="ghost" hidden>Follow up…</button>
      <span class="spacer"></span>
      <button id="sCancel" class="ghost">Cancel</button>
      <button id="sSave" class="primary">Add</button>
    </div>
  </div>
</div>

<!-- Settings sheet -->
<div id="settings" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gTitle">
    <div class="grab"></div>
    <h2 id="gTitle">Sync &amp; backup</h2>
    <p class="hint">Tasks are saved on this phone and automatically synced to a file in your <b>private</b> GitHub repo. Use a fine-grained token limited to that one repo (Contents: read &amp; write).</p>
    <label>GitHub username<input id="gOwner" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
    <label>Private data repo<input id="gRepo" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="todo-data"></label>
    <label>File path<input id="gPath" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="todos.json"></label>
    <label>Token<input id="gToken" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="github_pat_…"></label>
    <label>Branch <span class="opt">(optional)</span><input id="gBranch" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
    <div id="gStatus" class="status"></div>
    <div class="sheetBtns wrap">
      <button id="gExport" class="ghost">Export</button>
      <button id="gImportBtn" class="ghost">Import</button>
      <input type="file" id="gImport" accept="application/json,.json" hidden>
      <span class="spacer"></span>
      <button id="gClose" class="ghost">Close</button>
      <button id="gSave" class="primary">Save &amp; sync</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
